name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR replaces its run, but every merge to main runs to the
  # end: Deploy waits for CI on that exact commit and won't ship a cancelled one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    # The e2e tests take about 12 minutes on their own; installing the browser
    # has taken 10 when the runner is slow.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bookalyze_app:bookalyze_app@localhost:5432/bookalyze
      DATABASE_URL_MIGRATOR: postgres://bookalyze_owner:bookalyze_owner@localhost:5432/bookalyze
      TEST_DATABASE_URL: postgres://bookalyze_app:bookalyze_app@localhost:5432/bookalyze_test
      TEST_DATABASE_URL_MIGRATOR: postgres://bookalyze_owner:bookalyze_owner@localhost:5432/bookalyze_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_DEV_LOG: "true"
      # Receipts are stored on disk in CI (no S3).
      STORAGE_DRIVER: local
      SIGNUP_MODE: invite_only
      PLATFORM_ADMIN_EMAILS: owner@example.com
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's base too, to check the migrations it adds.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create database roles
        run: psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -f packages/db/scripts/dev-db-init.sql

      - name: Migrations that can't run on their own after merging
        if: github.event_name == 'pull_request'
        run: pnpm --filter @bookalyze/db check-migrations
        env:
          BASE_REF: origin/${{ github.base_ref }}
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate and seed
        run: pnpm db:setup
      - name: Unit and database tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @bookalyze/web build
      - name: Build the public site
        run: pnpm --filter @bookalyze/marketing build

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @bookalyze/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @bookalyze/web exec playwright install --with-deps chromium
      - name: Install the browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @bookalyze/web exec playwright install-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
