name: Deploy

# Production migrations, as a Vercel Deployment Check. Vercel builds main as usual; when a
# production build is ready it tells GitHub (repository_dispatch). This waits for CI on that
# commit, applies the pending database migrations that are safe to run unattended, and reports
# the check "Bookalyze: migrations". Vercel puts the build live only once it passes (Project →
# Settings → Deployment Checks), so new code never goes live before its migrations. A migration
# that could lose data or break the running app fails the check until a person runs it (see
# docs/SETUP.md → Deploys).

on:
  repository_dispatch:
    types: [vercel.deployment.ready]
  workflow_dispatch:
    inputs:
      allow_migrations:
        description: Migrations you've checked and allow, by tag (e.g. 0062_drop_old_column), comma separated
        required: false
        default: ""

permissions:
  contents: read
  checks: read
  statuses: write

concurrency:
  group: production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Database migrations
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHA: ${{ github.event.client_payload.git.sha || github.sha }}
    steps:
      # Sets the commit's "Bookalyze: migrations" status: pending now, then passed or failed
      # with this job. The name is the one chosen under Deployment Checks.
      - name: Report to Vercel
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Bookalyze: migrations"

      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check="Lint, typecheck, test, build, e2e"
          for _ in $(seq 1 70); do
            read -r status conclusion < <(gh api \
              "repos/${{ github.repository }}/commits/$SHA/check-runs?check_name=$(jq -rn --arg c "$check" '$c|@uri')" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | "\(.status // "missing") \(.conclusion // "-")"')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then echo "CI passed on $SHA."; exit 0; fi
              echo "::error::CI didn't pass on $SHA ($conclusion), so it won't go live."
              exit 1
            fi
            echo "CI on $SHA: ${status}…"
            sleep 30
          done
          echo "::error::CI on $SHA didn't finish in 35 minutes."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply safe migrations
        run: pnpm --filter @bookalyze/db deploy-migrate
        env:
          DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
